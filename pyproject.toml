[project]
name = "sports-calendar-integration"
version = "0.1.0"
description = "A Python tool that automatically syncs upcoming sports matches to your Google Calendar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.191.0",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.3.0",
    "requests>=2.32.5",
    "tzlocal>=5.3.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
sports-calendar = "sports_calendar.service:main"  # one run; the systemd timer starts it every 15 minutes
sports-calendar-summary = "sports_calendar.daily_summary:main"  # yesterday's totals; its timer starts it at 00:05
google-login = "sports_calendar.google_calendar.auth:main"
get-ids = "sports_calendar.tools.get_ids:main"
add-entity = "sports_calendar.tools.add_entity:main"
push-queries = "sports_calendar.tools.push_queries:main"
db-stats = "sports_calendar.tools.db_stats:main"

[dependency-groups]
# The server runs `uv run --no-dev`, so it installs neither group. Locally and in CI, `uv sync` and
# `uv run` install dev, which includes stats.
dev = [
    "pytest>=8.0.0",
    {include-group = "stats"},
]
stats = [  # src/sports_calendar/tools/db_stats.py
    "pandas>=3.0.1",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sports_calendar"  # the project name would give sports_calendar_integration

[tool.pytest.ini_options]
log_level = "INFO"  # the app logs its normal flow at INFO; let caplog see it
