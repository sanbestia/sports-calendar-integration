name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:  # deploy by hand (Actions → "Deploy to Oracle VM" → Run workflow), e.g. after changing the QUERIES_JSON_B64 secret

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test  # deploy only when the test suite passes
    if: github.ref == 'refs/heads/main'  # a manual run from another branch would test that branch but deploy main
    runs-on: ubuntu-latest
    # System packages are not upgraded here: unattended-upgrades on the VM installs security updates daily.
    steps:
      - name: Write queries.json to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            echo '${{ secrets.QUERIES_JSON_B64 }}' | base64 -d > /home/ubuntu/sports_calendar_integration/queries.json

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd /home/ubuntu/sports_calendar_integration
            git fetch origin main
            git reset --hard origin/main
            sudo install -m 644 deploy/sports-calendar.service /etc/systemd/system/sports-calendar.service
            sudo systemctl daemon-reload
            sudo systemctl restart sports-calendar
