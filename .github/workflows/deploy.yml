name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:  # deploy by hand (Actions → "Deploy to Oracle VM" → Run workflow), e.g. after changing the QUERIES_JSON_B64 secret

# One deploy at a time: a second one (another merge, or push-queries) waits until the first ends.
concurrency:
  group: deploy-oracle-vm
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test  # deploy only when the test suite passes
    if: github.ref == 'refs/heads/main'  # a manual run from another branch would test that branch but deploy main
    runs-on: ubuntu-latest
    # System packages are not upgraded here: unattended-upgrades on the VM installs security updates daily.
    steps:
      - uses: actions/checkout@v4  # for deploy/known_hosts and deploy/update-vm.sh

      - name: Set up SSH to the VM
        env:
          SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
        # ssh accepts only the host keys in deploy/known_hosts, under an alias, so the IP stays a secret.
        run: |
          set -e
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          printf '%s\n' "Host vm" "  HostName $VM_HOST" "  User ubuntu" "  IdentityFile ~/.ssh/vm_key" \
            "  HostKeyAlias sports-calendar-vm" "  UserKnownHostsFile $GITHUB_WORKSPACE/deploy/known_hosts" \
            "  GlobalKnownHostsFile /dev/null" "  StrictHostKeyChecking yes" "  ConnectTimeout 30" > ~/.ssh/config

      - name: Update the VM
        env:
          QUERIES_JSON_B64: ${{ secrets.QUERIES_JSON_B64 }}
        # The script reaches the VM on stdin, after a line that sets the secret, so the secret is never on a command line.
        # On any error it puts back the previous commit, packages, queries.json and timers (deploy/update-vm.sh).
        run: |
          { printf "QUERIES_JSON_B64='%s'\n" "$QUERIES_JSON_B64"; cat deploy/update-vm.sh; } | ssh vm bash -s
