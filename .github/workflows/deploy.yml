name: Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:  # deploy by hand (Actions → "Deploy to Oracle VM" → Run workflow), e.g. after changing the QUERIES_JSON_B64 secret

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test  # deploy only when the test suite passes
    if: github.ref == 'refs/heads/main'  # a manual run from another branch would test that branch but deploy main
    runs-on: ubuntu-latest
    # System packages are not upgraded here: unattended-upgrades on the VM installs security updates daily.
    steps:
      - name: Write queries.json to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            # the state folder of the units (StateDirectory=); systemd creates it at the first start, but this step runs before
            set -e
            sudo install -d -o ubuntu -g ubuntu -m 700 /var/lib/sports-calendar
            echo '${{ secrets.QUERIES_JSON_B64 }}' | base64 -d > /var/lib/sports-calendar/queries.json

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            # stop at the first failed command, so the job fails at that command and skips the steps after it
            set -e
            cd /home/ubuntu/sports_calendar_integration
            git fetch origin main
            git reset --hard origin/main
            # install the packages here, not at the service start; --locked fails on a uv.lock that does not match pyproject.toml
            /home/ubuntu/.local/bin/uv sync --locked --no-dev
            # stop a run that is in progress before its unit changes (before the timer, this stopped the forever loop)
            sudo systemctl stop sports-calendar.service
            sudo install -m 644 deploy/sports-calendar.service deploy/sports-calendar.timer deploy/sports-calendar-summary.service deploy/sports-calendar-summary.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            # remove the boot link of the service from before the timer; the timer starts each run now (no-op after the first time)
            sudo systemctl disable sports-calendar.service
            sudo systemctl enable --now sports-calendar.timer sports-calendar-summary.timer
            # one run now, which waits for the run to end: a run that fails also fails this job
            sudo systemctl start sports-calendar.service
